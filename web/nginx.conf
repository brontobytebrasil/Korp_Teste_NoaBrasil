server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A allowlist sai do que a página realmente carrega: o próprio pacote, as
    # fontes e os ícones do Material, e as duas APIs. connect-src precisa
    # nomear os dois serviços porque o navegador chama cada um direto.
    #
    # script-src fica sem 'unsafe-inline'. Para isso o build desliga o
    # inlineCritical (angular.json): ele publica o CSS com um onload inline,
    # que esta política bloquearia — a página até renderiza pelo link de
    # reserva, mas com três violações no console a cada carga.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:5001 http://localhost:5002; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Em aplicação de página única o roteamento é do navegador. Sem este
    # fallback, recarregar numa rota interna devolve 404 do servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
